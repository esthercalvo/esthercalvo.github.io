<!--Trial-->

<div class="row g-5 mb-5">
  <div class="col-12">
    <h3 class="fw-bold border-bottom pb-3 mb-4">Publications</h3>

    <!-- Optional floating image / visual accent -->
    <!-- Remove this block if you don't want any image -->
    <div class="mb-4 float-md-end ms-md-3 mb-md-3 text-center" style="max-width: 150px;">
      <img src="{{ site.github.url }}/assets/img/thesis_front.png" 
           alt="Dissertation Visual" 
           class="img-fluid rounded shadow-sm" 
           style="width: 100%; height: auto; object-fit: contain;">
    </div>

    <!-- Publications list -->
    <ul class="list-unstyled">
      {% for publication in site.data.publications %}
      <li class="mb-3">
        <strong>{{ publication.title }}</strong>{% if publication.journal %}, {{ publication.journal }}{% endif %} {% if publication.year %}({{ publication.year }}){% endif %}
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
