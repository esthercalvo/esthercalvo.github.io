<div class="row g-5 mb-5 align-items-center">
  <h3 class="fw-bold border-bottom pb-3 mb-4">Publications</h3>

  {% for item in site.data.publications.index %}
  <div class="row mb-4">
    <!-- Left: Text Info (Publication title, etc.) -->
    <div class="col-md-6">
      <p><strong>{{ item.name }}</strong></p>
      <p>{{ item.authors }}</p>
      <p><a href="{{ item.url }}" target="_blank" class="btn btn-sm btn-outline-primary">[Article]</a></p>
    </div>

    <!-- Right: Image (Larger image size) -->
    <div class="col-md-6 text-center">
      <img src="{{ site.github.url }}/assets/img/{{ item.image }}" 
           alt="Publication image"
           class="img-fluid rounded shadow-sm"
           style="max-height: 300px; width: 100%; object-fit: contain;" />
    </div>
  </div>
  {% endfor %}
</div>
