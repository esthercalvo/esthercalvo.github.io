<div class="row g-5 mb-5">
  <div class="col-md-12">
    {% if page.image %}
      <img src="{{ page.image }}" alt="{{ page.title }}" class="img-fluid mb-4" style="max-width: 600px; height: auto; display: block; margin: 0 auto;">
    {% endif %}
    <h3 class="fw-bold border-bottom pb-3 mb-5">{{ page.title }}</h3>
    {{ content }}
  </div>
</div>
