<!--Just the PhD as a photo-->
<div class="row g-5 mb-5">
  <!-- Full-height Flex Wrapper -->
  <div class="d-flex w-100" style="align-items: stretch;">
    
    <!-- Left: Publications List -->
    <div class="col-md-8">
      <h3 class="fw-bold border-bottom pb-3 mb-4">Publications</h3>

      {% if page.title == "Home" %}
        {% assign publications = site.data.publications.featured %}
      {% else %}
        {% assign publications = site.data.publications.index %}
      {% endif %}

      {% for item in publications %}
        <div class="mb-4">
          <h5 class="fw-semibold mb-1">{{ item.title }}</h5>
          <p class="mb-0 text-muted">{{ item.authors }}</p>
          <p class="mb-1 fst-italic">{{ item.journal }}</p>
          <a href="{{ item.url }}" class="btn btn-outline-primary btn-sm mt-2" target="_blank">Read Article</a>
        </div>
      {% endfor %}
    </div>

    <!-- Right: Dissertation Image filling the height -->
    <!--<div class="col-md-4 d-flex">-->
    <div class="col-md-5"> <!-- image -->
      <img src="{{ site.github.url }}/assets/img/thesis_front.png"
           alt="Dissertation Cover"
           class="img-fluid rounded shadow-sm w-100"
           style="object-fit: contain; height: auto; margin-top: 50px; margin-bottom: 50px" />
    </div>

  </div>
</div>
