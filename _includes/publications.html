<div class="row g-5 mb-5 align-items-start">
  <!-- Left: Title + Publication List -->
  <div class="col-md-8">
    <h3 class="fw-bold border-bottom pb-3 mb-4">Publications</h3>

    {% if page.title == "Home" %}
      {% for item in site.data.publications.featured %}
        <p><a href="{{ item.url }}" target="_blank">{{ item.name }}</a></p>
      {% endfor %}
    {% else %}
      {% for item in site.data.publications.index %}
        <p><a href="{{ item.url }}" target="_blank">{{ item.name }}</a></p>
      {% endfor %}
    {% endif %}
  </div>

  <!-- Right: Optional Image -->
  <div class="col-md-4 text-center">
    <img src="/assets/img/publications.png" alt="Publications" class="img-fluid rounded shadow-sm" />
  </div>
</div>
