<style>
  /* Container holding each card */
  .card-container {
    position: relative;          /* required for overlay positioning */
    overflow: hidden;            /* prevent overlay from spilling outside */
    cursor: pointer;
    border-radius: 0.25rem;      /* match Bootstrap rounded */
  }

  /* Card images */
  .card-container img {
    width: 100%;
    height: 250px;               /* uniform height */
    object-fit: cover;           /* fills card, may crop edges */
    display: block;
  }

  /* Overlay for title */
  .overlay-title {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.6); /* semi-transparent black */
    color: #fff;
    text-align: center;
    padding: 5px;
    font-size: 0.9rem;
    opacity: 0;                  /* hidden by default */
    transition: opacity 0.3s ease;
  }

  /* Show overlay on hover */
  .card-container:hover .overlay-title {
    opacity: 1;
  }
</style>

<div class="container">
  <h3 class="fw-bold border-bottom pb-3 mb-4">Publications</h3>
  <div class="row g-4">
    {% assign publications = site.data.publications.index %}
    {% for item in publications %}
      <div class="col-12 col-md-6">
        <a href="{{ item.url }}" target="_blank" class="text-decoration-none text-dark">
          <div class="card-container shadow-sm">
            <img src="{{ site.github.url }}/{{ item.image }}" alt="{{ item.title }}">
            <div class="overlay-title">{{ item.title }}</div>
          </div>
        </a>
      </div>
    {% endfor %}
  </div>
</div>
